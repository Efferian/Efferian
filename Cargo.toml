[workspace]
resolver = "3"
members = [
    "packages/efferian-protocol",
    "packages/efferian-platform",
    "packages/efferian-authz",
    "packages/efferian-client",
    "apps/hub",
    "apps/node",
    "apps/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
efferian-authz = { path = "packages/efferian-authz" }
efferian-client = { path = "packages/efferian-client" }
efferian-platform = { path = "packages/efferian-platform" }
efferian-protocol = { path = "packages/efferian-protocol" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
base64 = "0.23"
bytes = "1"
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
getrandom = "0.4"
hmac = { version = "0.13", features = ["zeroize"] }
http = "1"
http-body-util = "0.1"
hyper = { version = "1.13", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["http1", "tokio", "service"] }
ipnet = "2"
jsonschema = { version = "0.60", default-features = false }
libc = "0.2"
proc-macro2 = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-webpki-roots-no-provider"] }
rmcp = { version = "3", default-features = false, features = ["client", "server", "base64", "transport-streamable-http-client", "transport-streamable-http-server", "schemars"] }
rusqlite = { version = "0.39", features = ["bundled", "fallible_uint"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "2"
sha2 = { version = "0.11", features = ["zeroize"] }
sse-stream = "0.2"
subtle = "2"
thiserror = "2"
tokio = { version = "1", default-features = false }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake"] }
toml = "1"
tower-service = "0.3"
tracing = "0.1"
url = { version = "2", features = ["serde"] }
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-axum = "0.2"
uuid = { version = "1", features = ["v7", "serde"] }
webpki-roots = "1"
zeroize = { version = "1", features = ["serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
await_holding_lock = "deny"
dbg_macro = "deny"
exit = "deny"

[profile.dev]
debug = 1
incremental = true

[profile.test]
debug = 1
incremental = true
