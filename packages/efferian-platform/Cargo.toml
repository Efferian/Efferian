[package]
name = "efferian-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
process = ["dep:tokio"]

[dependencies]
getrandom = { workspace = true }
libc = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true, features = ["process", "time", "signal"] }

[dev-dependencies]
proc-macro2 = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "process", "time", "signal", "io-util"] }
toml = { workspace = true }

[[test]]
name = "process_group"
required-features = ["process"]

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
await_holding_lock = "deny"
dbg_macro = "deny"
exit = "deny"
